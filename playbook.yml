---
- name: NMAP scaner
  hosts: webservers
  become: yes
  become_method: sudo
  remote_user: runner
  gather_facts: false

  tasks:
    - name: Install NMAP
      ansible.builtin.apt:
        name: nmap
        state: present
        update_cache: true

    - name: Run nmap
      ansible.builtin.shell: "nmap {{ item }} -p 80 -oG -"
      loop: "{{ lookup('file', './target.txt').splitlines() }}"
      register: nmap_result

    - name: Nmap output
      ansible.builtin.debug:
        msg: "{{ item.stdout_lines }}"
      loop: "{{ nmap_result.results }}"